# =============================================================================
# Deploy Prod — Builds, tags, and smoke-tests the production-candidate image
# =============================================================================
# WHAT: Builds the Dockerfile's "production" stage, tags it as a prod
#       candidate, then boots it against a real Postgres service container
#       and hits /api/health and /api/jokes to confirm the image that would
#       ship to production actually works.
# WHY:  Same reasoning as deploy-staging.yml, this proves the artifact
#       works before anything is asked to run it for real. The
#       "environment: production" line below ties this job to a GitHub
#       Environment named "production", which is what lets required
#       reviewers or a wait timer be attached later from the repo's Settings
#       > Environments page. It doesn't require anything to be configured
#       there today, GitHub creates the environment with no protection rules
#       on first use, and adding rules there is how a real approval gate
#       gets added later without touching this file.
# HOW:  Triggers on push to "main", or manually via workflow_dispatch.
#
# No push-to-registry or deploy step exists here on purpose: no production
# host has been set up yet. See the TODO at the bottom of this file.
# =============================================================================

name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dad_jokes_prod
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target production -t dad-jokes-api:prod-${{ github.sha }} .

      - name: Start container against the service Postgres
        run: |
          docker run -d --name dad-jokes-prod-check --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e DB_NAME=dad_jokes_prod \
            -e PORT=3001 \
            -e ADMIN_TOKEN=prod-ci-check \
            dad-jokes-api:prod-${{ github.sha }}

      - name: Smoke test the production-candidate image
        run: |
          echo "Waiting for the container to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "Container is up after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container never became healthy."
              docker logs dad-jokes-prod-check
              exit 1
            fi
            sleep 2
          done

          echo "GET /api/health:"
          curl -sf http://localhost:3001/api/health | tee /dev/stderr | grep -q '"status":"alive"'

          echo "GET /api/jokes:"
          curl -sf http://localhost:3001/api/jokes | tee /dev/stderr | grep -q '"success":true'

      - name: Container logs
        if: always()
        run: docker logs dad-jokes-prod-check || true

      - name: Stop container
        if: always()
        run: docker rm -f dad-jokes-prod-check || true

      # TODO: once production hosting exists, add steps here to push
      # "dad-jokes-api:prod-${{ github.sha }}" to that registry and trigger
      # the real deploy. Nothing deploys anywhere today, this job only
      # proves the image that would ship actually boots and serves requests.
