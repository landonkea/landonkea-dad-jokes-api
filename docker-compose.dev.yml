# =============================================================================
# docker-compose.dev.yml — Dev environment: hot reload, disposable database
# =============================================================================
# WHAT: Runs the app from the Dockerfile's "development" stage (tsx watch on
#       the server, Vite's dev server on the client, live source bind-mounted
#       from the host) alongside its own throwaway Postgres container.
# WHY:  The root docker-compose.yml builds the "production" stage, which is
#       the right thing for smoke-testing the actual deployable image but
#       the wrong thing to iterate against: every source edit would need a
#       full image rebuild. This file exists so dev work has its own compose
#       file instead of overloading the root one with a mode flag.
# HOW:  docker compose -f docker-compose.dev.yml up --build
#       Then visit http://localhost:5173 (Vite dev server, hot-reloads on
#       edit) or http://localhost:3001/api/health (the API directly).
#
# "name:" pins the Compose project name to "dad-jokes-dev" so its containers,
# volumes, and network don't collide with the root docker-compose.yml or the
# staging/prod compose files if more than one happens to be running at once.
# =============================================================================

name: dad-jokes-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dad_jokes_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: development
    env_file:
      - .env.dev
    ports:
      - "3001:3001"
      - "5173:5173"
    volumes:
      # Bind-mount live source over what the image copied in at build time,
      # this is what makes "development" a hot-reload stage instead of a
      # frozen snapshot.
      - ./server:/app/server
      - ./client:/app/client
      # Anonymous volumes over each node_modules path so the bind mounts
      # above don't shadow them with the host's node_modules. macOS-built
      # native binaries (esbuild, lightningcss) copied straight into this
      # Alpine Linux container would fail to load, this keeps the
      # container's own Linux-native install intact.
      - /app/node_modules
      - /app/server/node_modules
      - /app/client/node_modules
    depends_on:
      - db

volumes:
  pgdata_dev:
